<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- The same glyph the site wordmark carries (components/site/Logo.tsx) —
       a favicon that draws something else reads as a different site in the tab.
       The dark plate keeps the deep purple legible on a light tab strip. -->
