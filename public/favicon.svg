    <linearGradient id="g" x1="6" y1="4" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C3A8F" />
      <stop offset="1" stop-color="#7E5BD6" />
    </linearGradient>
  </defs>
  <rect width="40" height="40" rx="9" fill="#0E0918" />
  <g transform="translate(20 20) scale(0.72) translate(-20 -18.5)">
    <path d="M20 3 L37 34 L26 34 L20 22 L14 34 L3 34 Z" fill="url(#g)" />
    <path d="M20 27.5 L23.2 34 L16.8 34 Z" fill="#B8FF2E" />
  </g>
</svg>
